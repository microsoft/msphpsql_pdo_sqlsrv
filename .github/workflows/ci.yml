# Minimal CI for the microsoft/pdo_sqlsrv PIE companion package.
# Validates the PIE/Composer metadata on every push and pull request.
# Note: pin actions to commit SHAs if required by your org policy before use.
name: CI

on:
  push:
    branches: [ dev ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer

      - name: Validate composer metadata
        run: composer validate --strict --no-check-lock --no-check-publish
